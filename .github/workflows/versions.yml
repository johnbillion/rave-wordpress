name: Verify distributed versions

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string
      package:
        description: Package for WordPress release
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: "${{ inputs.package }}"
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Verify versions distributed by GitHub
        if: inputs.package == 'github-zip'
        env:
          TAG: ${{ steps.tag.outputs.short }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/WordPress/WordPress/tags)
          echo "GitHub API response: $response"
          latest_tag=$(echo "$response" | jq --raw-output '.[0].name')
          if [ "$latest_tag" != "$TAG" ]; then
            echo "Error: Found a newer tag ($latest_tag) than $TAG"
            exit 1
          fi

      - name: Verify versions distributed by roots/wordpress-full
        if: inputs.package == 'roots-wordpress-full'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: |
          set -e
          latest_version=$(curl -s https://repo.packagist.org/p2/roots/wordpress-full.json | jq --raw-output '.packages["roots/wordpress-full"] | map(.version) | .[]' | grep -Ev -- '-(RC|rc|beta|alpha|dev)' | sort -V | tail -n1)
          if [ "$latest_version" != "$TAG" ]; then
            echo "Error: Found a newer version ($latest_version) than $TAG"
            exit 1
          fi

      - name: Verify versions distributed by johnpbloch/wordpress
        if: inputs.package == 'johnpbloch-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: |
          set -e
          latest_version=$(curl -s https://repo.packagist.org/p2/johnpbloch/wordpress.json | jq --raw-output '.packages["johnpbloch/wordpress"] | map(.version) | sort_by(.) | last')
          if [ "$latest_version" != "$TAG" ]; then
            echo "Error: Found a newer version ($latest_version) than $TAG"
            exit 1
          fi

      - name: Verify versions distributed by Docker
        if: inputs.package == 'docker-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: |
          set -e
          latest_tag=$(curl -s 'https://hub.docker.com/v2/repositories/library/wordpress/tags?page_size=100' | jq --raw-output '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$latest_tag" != "$TAG" ]; then
            echo "Error: Found a newer tag ($latest_tag) than $TAG"
            exit 1
          fi

      - name: Verify versions distributed by AspireCloud
        if: inputs.package == 'aspirecloud-zip'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: |
          set -e
          latest_version=$(curl -s 'https://api.aspirecloud.net/core/version-check/1.7/' | jq --raw-output '.offers[].version' | sort -V | tail -n1)
          if [ "$latest_version" != "$TAG" ]; then
            echo "Error: Found a newer version ($latest_version) than $TAG"
            exit 1
          fi

      - name: Verify versions distributed by FAIR
        if: inputs.package == 'fair-zip'
        env:
          TAG: ${{ steps.tag.outputs.next }}
        run: |
          set -e
          url="https://github.com/fairpm/fair-plugin/releases/latest/download/wordpress-${TAG}-fair.zip"
          status=$(curl -L -o /dev/null -s -w "%{http_code}" "$url")
          if [ "$status" != "404" ]; then
            echo "Error: Found a release for next version ($TAG) at $url"
            exit 1
          fi

      - name: Verify versions distributed by WPEngine
        if: inputs.package == 'wpengine-zip'
        env:
          TAG: ${{ steps.tag.outputs.next }}
        run: |
          set -e
          url="https://core-updates.wpengine.com/wordpress-${TAG}.zip"
          status=$(curl -o /dev/null -s -w "%{http_code}" "$url")
          if [ "$status" != "404" ]; then
            echo "Error: Found a release for next version ($TAG) at $url"
            exit 1
          fi

      - name: Verify the stable-check endpoint
        if: inputs.package == 'stable-check'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: |
          set -e
          latest_version=$(curl -s 'https://api.wordpress.org/core/stable-check/1.0/' | jq --raw-output 'to_entries[].key' | sort -V | tail -n1)
          if [ "$latest_version" != "$TAG" ]; then
            echo "Error: Found a newer version ($latest_version) than $TAG"
            exit 1
          fi
