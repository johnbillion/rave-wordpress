name: Verify package

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string
      package:
        description: Package for WordPress release
        required: true
        type: string

permissions: {}

env:
  PACKAGE_URL: ""
  PACKAGE_INCLUDES_AKISMET: "true"
  AKISMET_VERSION: ""

jobs:
  verify:
    name: "${{ inputs.package }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # Required to generate OIDC token for attestation
      attestations: write # Required to create and upload attestations
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: $/.github/actions/prepare-tag-name
        with:
          tag: ${{ inputs.tag }}

      - name: Prepare URL
        id: url
        env:
          PACKAGE: ${{ inputs.package }}
          TAG_SHORT: ${{ steps.tag.outputs.short }}
          TAG_LONG: ${{ steps.tag.outputs.long }}
        run: | #shell
          case "$PACKAGE" in
            github-zip)
              PACKAGE_URL="https://github.com/WordPress/WordPress/archive/refs/tags/${TAG_SHORT}.zip"
              PACKAGE_INCLUDES_AKISMET=false
              ;;
            wordpress.org-zip)
              PACKAGE_URL="https://wordpress.org/wordpress-${TAG_SHORT}.zip"
              ;;
            wordpress.org-tar)
              PACKAGE_URL="https://wordpress.org/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            downloads.wordpress.org-zip)
              PACKAGE_URL="https://downloads.wordpress.org/release/wordpress-${TAG_SHORT}.zip"
              ;;
            downloads.wordpress.org-tar)
              PACKAGE_URL="https://downloads.wordpress.org/release/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            downloads.w.org-zip)
              PACKAGE_URL="https://downloads.w.org/release/wordpress-${TAG_SHORT}.zip"
              ;;
            downloads.w.org-tar)
              PACKAGE_URL="https://downloads.w.org/release/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            build.trac.wordpress.org)
              PACKAGE_URL="https://build.trac.wordpress.org/browser/tags/${TAG_SHORT}?format=zip"
              PACKAGE_INCLUDES_AKISMET=false
              ;;
            wpengine-zip)
              PACKAGE_URL="https://core-updates.wpengine.com/wordpress-${TAG_SHORT}.zip"
              ;;
            aspirecloud-zip)
              PACKAGE_URL="https://api.aspirecloud.net/download/wordpress-${TAG_SHORT}.zip"
              ;;
            pantheon-zip)
              PACKAGE_URL="https://github.com/pantheon-systems/WordPress/archive/refs/tags/${TAG_SHORT}.zip"
              PACKAGE_INCLUDES_AKISMET=false
              ;;
            roots-wordpress-full)
              PACKAGE_URL="https://packagist.org/packages/roots/wordpress-full#${TAG_SHORT}"
              ;;
            johnpbloch-wordpress)
              PACKAGE_URL="https://packagist.org/packages/johnpbloch/wordpress#${TAG_SHORT}"
              ;;
            wp-core-wordpress)
              PACKAGE_URL="https://api.wordpress.org/packages/p2/wp-core/wordpress.json"
              ;;
          esac
          echo PACKAGE_URL="$PACKAGE_URL" >> "$GITHUB_ENV"
          echo PACKAGE_INCLUDES_AKISMET="$PACKAGE_INCLUDES_AKISMET" >> "$GITHUB_ENV"

      - name: Download artifact of the reproduced build
        if: inputs.tag != 'latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wordpress-${{ steps.tag.outputs.long }}-develop.svn.wordpress.org
          path: source

      - name: Download version artifact
        if: inputs.tag == 'latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version.txt

      - name: Extract the latest version number from version.txt
        if: inputs.tag == 'latest'
        id: extract
        run: | #shell
          echo latest="$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Download artifact of the reproduced build
        if: inputs.tag == 'latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "wordpress-${{ steps.extract.outputs.latest }}-develop.svn.wordpress.org"
          path: source

      - name: Get zip file from GitHub
        if: inputs.package == 'github-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract GitHub zip
        if: inputs.package == 'github-zip'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip -d wordpress
          mv "wordpress/WordPress-${TAG}" package

      - name: Get zip file from wordpress.org
        if: inputs.package == 'wordpress.org-zip' && inputs.tag != 'latest'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract wordpress.org zip
        if: inputs.package == 'wordpress.org-zip' && inputs.tag != 'latest'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from wordpress.org
        if: inputs.package == 'wordpress.org-tar' && inputs.tag != 'latest'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz

      - name: Extract wordpress.org tar
        if: inputs.package == 'wordpress.org-tar' && inputs.tag != 'latest'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get latest zip file from wordpress.org
        if: inputs.package == 'wordpress.org-zip' && inputs.tag == 'latest'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: https://wordpress.org/latest.zip
          output: package.zip

      - name: Extract latest wordpress.org zip
        if: inputs.package == 'wordpress.org-zip' && inputs.tag == 'latest'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get latest tar file from wordpress.org
        if: inputs.package == 'wordpress.org-tar' && inputs.tag == 'latest'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: https://wordpress.org/latest.tar.gz
          output: package.tar.gz

      - name: Extract latest wordpress.org tar
        if: inputs.package == 'wordpress.org-tar' && inputs.tag == 'latest'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get zip file from downloads.wordpress.org
        if: inputs.package == 'downloads.wordpress.org-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract downloads.wordpress.org zip
        if: inputs.package == 'downloads.wordpress.org-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from downloads.wordpress.org
        if: inputs.package == 'downloads.wordpress.org-tar'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz

      - name: Extract downloads.wordpress.org tar
        if: inputs.package == 'downloads.wordpress.org-tar'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get zip file from downloads.w.org
        if: inputs.package == 'downloads.w.org-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract downloads.w.org zip
        if: inputs.package == 'downloads.w.org-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from downloads.w.org
        if: inputs.package == 'downloads.w.org-tar'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz

      - name: Extract downloads.w.org tar
        if: inputs.package == 'downloads.w.org-tar'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Download zip from build.trac.wordpress.org
        if: inputs.package == 'build.trac.wordpress.org'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract build.trac.wordpress.org zip
        if: inputs.package == 'build.trac.wordpress.org'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip -d wordpress
          mv "wordpress/${TAG}" package

      - name: Download zip from core-updates.wpengine.com
        if: inputs.package == 'wpengine-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract core-updates.wpengine.com zip
        if: inputs.package == 'wpengine-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Download zip from api.aspirecloud.net
        if: inputs.package == 'aspirecloud-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract api.aspirecloud.net zip
        if: inputs.package == 'aspirecloud-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Download zip from pantheon-systems/WordPress
        if: inputs.package == 'pantheon-zip'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip

      - name: Extract pantheon-systems/WordPress zip
        if: inputs.package == 'pantheon-zip'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip -d wordpress
          mv "wordpress/WordPress-${TAG}" package

      - name: Download roots/wordpress-full
        if: inputs.package == 'roots-wordpress-full'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          composer require "roots/wordpress-full:${TAG}" --prefer-dist --no-progress
          mv vendor/roots/wordpress-full package

      - name: Download johnpbloch/wordpress
        if: inputs.package == 'johnpbloch-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          composer require "johnpbloch/wordpress:${TAG}" --prefer-dist --no-progress --no-plugins
          mv vendor/johnpbloch/wordpress-core package
          rm package/composer.json

      - name: Download wp-core/wordpress
        if: inputs.package == 'wp-core-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          composer init --no-interaction --name "johnbillion/rave-wordpress" --stability stable
          composer config repositories.wp-core composer https://api.wordpress.org/packages/
          composer require "wp-core/wordpress:${TAG}" --prefer-dist --no-progress --no-plugins
          mv vendor/wp-core/wordpress package

      - name: Handle anomalies with build files in TT and TT1
        if: inputs.package == 'github-zip' || inputs.package == 'build.trac.wordpress.org'
        run: | #shell
          rm package/wp-content/themes/twentytwenty/.npmrc
          rm package/wp-content/themes/twentytwenty/.stylelintrc.json
          rm package/wp-content/themes/twentytwentyone/.npmrc
          rm package/wp-content/themes/twentytwentyone/.stylelintignore
          rm package/wp-content/themes/twentytwentyone/.stylelintrc-css.json
          rm package/wp-content/themes/twentytwentyone/.stylelintrc.json

      # Pantheon adds its own platform files, and its wp-content directory
      # stays frozen at the versions first committed to the repo.
      - name: Handle the Pantheon upstream's platform files and untracked wp-content
        if: inputs.package == 'pantheon-zip'
        run: | #shell
          rm -r source/wp-content
          rm -r package/wp-content
          rm package/.gitignore
          rm package/README.md
          rm package/pantheon.upstream.yml
          rm package/wp-config.php
          rm package/wp-config-pantheon.php
          rm package/wp-config-local-sample.php

      - name: Handle known differences in the source
        uses: $/.github/actions/handle-known-differences
        with:
          path: source
          tag: ${{ inputs.tag }}
          branch: ${{ steps.tag.outputs.branch }}

      - name: Handle known differences in the package
        uses: $/.github/actions/handle-known-differences
        with:
          path: package
          tag: ${{ inputs.tag }}
          branch: ${{ steps.tag.outputs.branch }}

      - name: Extract Akismet
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          mv package/wp-content/plugins/akismet akismet-package

      - name: Tree source
        run: | #shell
          tree source || true

      - name: Tree package
        run: | #shell
          tree package || true

      - name: Compare files
        run: | #shell
          diff --strip-trailing-cr --recursive --color=always source package

      - name: Detect Akismet version
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          AKISMET_VERSION="$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([0-9.]+).*$/\1/p' akismet-package/akismet.php)"
          echo "Akismet version: $AKISMET_VERSION"
          echo "AKISMET_VERSION=$AKISMET_VERSION" >> "$GITHUB_ENV"

      - name: Fetch Akismet ${{ env.AKISMET_VERSION }} from source
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        uses: johnbillion/plugin-infrastructure/actions/svn-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: https://plugins.svn.wordpress.org/akismet/tags/${{ env.AKISMET_VERSION }}/
          path: akismet-source

      - name: Verify Akismet
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          diff --strip-trailing-cr --recursive --color=always akismet-source akismet-package

      - name: Check for package files
        id: package-check
        env:
          PACKAGE: ${{ inputs.package }}
        run: | #shell
          # Only the core files in the Pantheon upstream are verified, so its archive
          # is deliberately left unattested.
          if [ "$PACKAGE" = "pantheon-zip" ]; then
            echo "package_file=false" >> "$GITHUB_OUTPUT"
          elif [ -f "package.zip" ]; then
            echo "package_file=package.zip" >> "$GITHUB_OUTPUT"
            echo "package_extension=zip" >> "$GITHUB_OUTPUT"
          elif [ -f "package.tar.gz" ]; then
            echo "package_file=package.tar.gz" >> "$GITHUB_OUTPUT"
            echo "package_extension=tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "package_file=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing attestation
        if: steps.package-check.outputs.package_file != 'false' && inputs.tag != 'latest'
        id: attestation-check
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package-check.outputs.package_file }}
        run: | #shell
          if gh attestation verify "${PACKAGE_FILE}" --repo johnbillion/rave-wordpress --predicate-type "https://in-toto.io/attestation/release/v0.1"; then
            echo "Attestation already exists"
            echo "attestation_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No attestation found, will create one"
            echo "attestation_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release predicate
        if: steps.package-check.outputs.package_file != 'false' && steps.attestation-check.outputs.attestation_exists == 'false' && inputs.tag != 'latest'
        env:
          TAG: ${{ steps.tag.outputs.short }}
          PACKAGE_FILE: ${{ steps.package-check.outputs.package_file }}
          PACKAGE_EXTENSION: ${{ steps.package-check.outputs.package_extension }}
        run: | #shell
          # Generate SHA256 of package file
          PACKAGE_SHA256=$(sha256sum "${PACKAGE_FILE}" | cut -d' ' -f1)

          # Generate the predicate
          cat > release-predicate.json <<EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "wordpress-${TAG}.${PACKAGE_EXTENSION}",
                "digest": {
                  "sha256": "${PACKAGE_SHA256}"
                }
              }
            ],
            "predicateType": "https://in-toto.io/attestation/release/v0.1",
            "predicate": {
              "purl": "pkg:rave/wordpress@${TAG}",
              "metadata": {
                "releaseNotes": "WordPress ${TAG}",
                "vcs": {
                  "type": "git",
                  "uri": "https://github.com/johnbillion/rave-wordpress",
                  "revision": "${GITHUB_SHA}"
                }
              }
            }
          }
          EOF

      - name: Generate attestation
        if: steps.package-check.outputs.package_file != 'false' && steps.attestation-check.outputs.attestation_exists == 'false' && inputs.tag != 'latest'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-check.outputs.package_file }}
          subject-name: 'wordpress-${{ steps.tag.outputs.short }}.${{ steps.package-check.outputs.package_extension }}'
          predicate-type: 'https://in-toto.io/attestation/release/v0.1'
          predicate-path: 'release-predicate.json'

      - name: Verify attestation
        if: steps.package-check.outputs.package_file != 'false' && steps.attestation-check.outputs.attestation_exists == 'false' && inputs.tag != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package-check.outputs.package_file }}
        run: | #shell
          gh attestation verify "${PACKAGE_FILE}" --repo johnbillion/rave-wordpress --predicate-type "https://in-toto.io/attestation/release/v0.1"
