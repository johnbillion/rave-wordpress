name: Verify package

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string
      package:
        description: Package for WordPress release
        required: true
        type: string

permissions: {}

env:
  PACKAGE_URL: ""
  PACKAGE_INCLUDES_AKISMET: "true"
  AKISMET_VERSION: ""

jobs:
  verify:
    name: "${{ inputs.package }}"
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    environment:
      name: ${{ inputs.package }}
      url: ${{ env.PACKAGE_URL }}
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Prepare URL
        id: url
        env:
          PACKAGE: ${{ inputs.package }}
          TAG_SHORT: ${{ steps.tag.outputs.short }}
          TAG_LONG: ${{ steps.tag.outputs.long }}
        run: | #shell
          case "$PACKAGE" in
            github-zip)
              PACKAGE_URL="https://github.com/WordPress/WordPress/archive/refs/tags/${TAG_SHORT}.zip"
              PACKAGE_INCLUDES_AKISMET=false
              ;;
            wordpress.org-zip)
              PACKAGE_URL="https://wordpress.org/wordpress-${TAG_SHORT}.zip"
              ;;
            wordpress.org-tar)
              PACKAGE_URL="https://wordpress.org/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            downloads.wordpress.org-zip)
              PACKAGE_URL="https://downloads.wordpress.org/release/wordpress-${TAG_SHORT}.zip"
              ;;
            downloads.wordpress.org-tar)
              PACKAGE_URL="https://downloads.wordpress.org/release/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            downloads.w.org-zip)
              PACKAGE_URL="https://downloads.w.org/release/wordpress-${TAG_SHORT}.zip"
              ;;
            downloads.w.org-tar)
              PACKAGE_URL="https://downloads.w.org/release/wordpress-${TAG_SHORT}.tar.gz"
              ;;
            build.trac.wordpress.org)
              PACKAGE_URL="https://build.trac.wordpress.org/browser/tags/${TAG_SHORT}?format=zip"
              PACKAGE_INCLUDES_AKISMET=false
              ;;
            docker-wordpress)
              PACKAGE_URL="https://hub.docker.com/_/wordpress/tags?name=${TAG_LONG}&ordering=-name"
              ;;
            wpengine-zip)
              PACKAGE_URL="https://core-updates.wpengine.com/wordpress-${TAG_SHORT}.zip"
              ;;
            aspirecloud-zip)
              PACKAGE_URL="https://api.aspirecloud.net/download/wordpress-${TAG_SHORT}.zip"
              ;;
            fair-zip)
              PACKAGE_URL="https://github.com/fairpm/fair-plugin/releases/latest/download/wordpress-${TAG_SHORT}-fair.zip"
              ;;
            roots-wordpress-full)
              PACKAGE_URL="https://packagist.org/packages/roots/wordpress-full#${TAG_SHORT}"
              ;;
            johnpbloch-wordpress)
              PACKAGE_URL="https://packagist.org/packages/johnpbloch/wordpress#${TAG_SHORT}"
              ;;
          esac
          echo PACKAGE_URL="$PACKAGE_URL" >> "$GITHUB_ENV"
          echo PACKAGE_INCLUDES_AKISMET="$PACKAGE_INCLUDES_AKISMET" >> "$GITHUB_ENV"

      - name: Download artifact
        if: inputs.tag != 'latest'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # 4.1.8
        with:
          name: wordpress-${{ steps.tag.outputs.long }}-develop.svn.wordpress.org
          path: source

      - name: Download versions artifact
        if: inputs.tag == 'latest'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # 4.1.8
        with:
          name: versions

      - name: Extract the latest version number from versions.json
        if: inputs.tag == 'latest'
        id: extract
        run: | #shell
          echo latest="$(jq --raw-output '.[0]' versions.json)" >> "$GITHUB_OUTPUT"

      - name: Download latest artifact
        if: inputs.tag == 'latest'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # 4.1.8
        with:
          name: "wordpress-${{ steps.extract.outputs.latest }}-develop.svn.wordpress.org"
          path: source

      - name: Get zip file from GitHub
        if: inputs.package == 'github-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract GitHub zip
        if: inputs.package == 'github-zip'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip -d wordpress
          mv "wordpress/WordPress-${TAG}" package

      - name: Get zip file from wordpress.org
        if: inputs.package == 'wordpress.org-zip' && inputs.tag != 'latest'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract wordpress.org zip
        if: inputs.package == 'wordpress.org-zip' && inputs.tag != 'latest'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from wordpress.org
        if: inputs.package == 'wordpress.org-tar' && inputs.tag != 'latest'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract wordpress.org tar
        if: inputs.package == 'wordpress.org-tar' && inputs.tag != 'latest'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get latest zip file from wordpress.org
        if: inputs.package == 'wordpress.org-zip' && inputs.tag == 'latest'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: https://wordpress.org/latest.zip
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract latest wordpress.org zip
        if: inputs.package == 'wordpress.org-zip' && inputs.tag == 'latest'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get latest tar file from wordpress.org
        if: inputs.package == 'wordpress.org-tar' && inputs.tag == 'latest'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: https://wordpress.org/latest.tar.gz
          output: package.tar.gz
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract latest wordpress.org tar
        if: inputs.package == 'wordpress.org-tar' && inputs.tag == 'latest'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get zip file from downloads.wordpress.org
        if: inputs.package == 'downloads.wordpress.org-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract downloads.wordpress.org zip
        if: inputs.package == 'downloads.wordpress.org-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from downloads.wordpress.org
        if: inputs.package == 'downloads.wordpress.org-tar'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract downloads.wordpress.org tar
        if: inputs.package == 'downloads.wordpress.org-tar'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Get zip file from downloads.w.org
        if: inputs.package == 'downloads.w.org-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract downloads.w.org zip
        if: inputs.package == 'downloads.w.org-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Get tar file from downloads.w.org
        if: inputs.package == 'downloads.w.org-tar'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.tar.gz
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract downloads.w.org tar
        if: inputs.package == 'downloads.w.org-tar'
        run: | #shell
          mkdir wordpress
          tar -xzf package.tar.gz -C wordpress
          mv wordpress/wordpress package

      - name: Download zip from build.trac.wordpress.org
        if: inputs.package == 'build.trac.wordpress.org'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract build.trac.wordpress.org zip
        if: inputs.package == 'build.trac.wordpress.org'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip -d wordpress
          mv "wordpress/${TAG}" package

      - name: Download Docker image
        if: inputs.package == 'docker-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          yq --null-input '{"services":{"wordpress":{"image":"wordpress:"+strenv(TAG),"container_name":"wordpress","volumes":["./package:/var/www/html"]}}}' > docker-compose.yml
          docker compose up -d wordpress
          docker compose run --rm wordpress -- ls -al /var/www/html
          docker compose run --rm wordpress -- rm /var/www/html/.htaccess
          docker compose run --rm wordpress -- rm /var/www/html/wp-config-docker.php

      - name: Download zip from core-updates.wpengine.com
        if: inputs.package == 'wpengine-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract wpengine zip
        if: inputs.package == 'wpengine-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Download zip from api.aspirecloud.net
        if: inputs.package == 'aspirecloud-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract aspirecloud zip
        if: inputs.package == 'aspirecloud-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Download zip from FAIR
        if: inputs.package == 'fair-zip'
        uses: johnbillion/rave-wordpress/.github/actions/download-with-retry@trunk
        with:
          url: ${{ env.PACKAGE_URL }}
          output: package.zip
          user-agent: WordPress/${{ steps.tag.outputs.short }}

      - name: Extract FAIR zip
        if: inputs.package == 'fair-zip'
        run: | #shell
          unzip -q package.zip -d wordpress
          mv wordpress/wordpress package

      - name: Download roots/wordpress-full
        if: inputs.package == 'roots-wordpress-full'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          composer require "roots/wordpress-full:${TAG}" --prefer-dist --no-progress
          mv vendor/roots/wordpress-full package

      - name: Download johnpbloch/wordpress
        if: inputs.package == 'johnpbloch-wordpress'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          composer require "johnpbloch/wordpress:${TAG}" --prefer-dist --no-progress --no-plugins
          mv vendor/johnpbloch/wordpress-core package
          rm package/composer.json

      - name: Handle anomalies with build files in TT and TT1
        if: inputs.package == 'github-zip' || inputs.package == 'build.trac.wordpress.org'
        run: | #shell
          rm package/wp-content/themes/twentytwenty/.npmrc
          rm package/wp-content/themes/twentytwenty/.stylelintrc.json
          rm package/wp-content/themes/twentytwentyone/.npmrc
          rm package/wp-content/themes/twentytwentyone/.stylelintignore
          rm package/wp-content/themes/twentytwentyone/.stylelintrc-css.json
          rm package/wp-content/themes/twentytwentyone/.stylelintrc.json

      - name: Handle known differences in bundled themes
        if: inputs.package != 'github-zip' && inputs.package != 'build.trac.wordpress.org'
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ steps.tag.outputs.branch }}
        run: | #shell
          rm -rf source/wp-content/themes/twentyten
          rm -rf source/wp-content/themes/twentyeleven
          rm -rf source/wp-content/themes/twentytwelve
          rm -rf source/wp-content/themes/twentythirteen
          rm -rf source/wp-content/themes/twentyfourteen
          rm -rf source/wp-content/themes/twentyfifteen
          rm -rf source/wp-content/themes/twentysixteen
          rm -rf source/wp-content/themes/twentyseventeen
          if [[ "${TAG}" == "latest" ]] || dpkg --compare-versions "${BRANCH}" ge "6.4"; then
            rm -rf source/wp-content/themes/twentynineteen
            rm -rf source/wp-content/themes/twentytwenty
            rm -rf source/wp-content/themes/twentytwentyone
          fi
          if [[ "${TAG}" == "latest" ]] || dpkg --compare-versions "${BRANCH}" ge "6.7"; then
            rm -rf source/wp-content/themes/twentytwentytwo
          fi

      - name: Handle known differences in bundled plugins
        if: inputs.package == 'fair-zip'
        run: | #shell
          rm -rf package/wp-content/plugins/fair-plugin

      - name: Extract Akismet
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          mv package/wp-content/plugins/akismet akismet-package

      - name: Tree source
        run: | #shell
          tree source || true

      - name: Tree package
        run: | #shell
          tree package || true

      - name: Compare files
        run: | #shell
          diff --strip-trailing-cr --recursive --color=always source package

      - name: Detect Akismet version
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          AKISMET_VERSION="$(grep -E '^\s*\*?\s*Version:' akismet-package/akismet.php | head -n1 | sed -E 's/^.*Version:[[:space:]]*([0-9.]+).*$/\1/')"
          echo "Akismet version: $AKISMET_VERSION"
          echo "AKISMET_VERSION=$AKISMET_VERSION" >> "$GITHUB_ENV"

      - name: Fetch Akismet {{ env.AKISMET_VERSION }} from source
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          sudo apt-get update
          sudo apt-get install -y subversion
          svn --version
          svn checkout --quiet --ignore-externals https://plugins.svn.wordpress.org/akismet/tags/$AKISMET_VERSION/ akismet-source
          rm -rf akismet-source/.svn

      - name: Verify Akismet
        if: env.PACKAGE_INCLUDES_AKISMET == 'true'
        run: | #shell
          diff --strip-trailing-cr --recursive --color=always akismet-source akismet-package
