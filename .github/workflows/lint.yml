# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Lint
on:
  pull_request:
    paths:
      # Only run when changes are made to workflow files.
      - '.github/workflows/**'
  push:
    branches:
      - trunk
    paths:
      # Only run when changes are made to workflow files.
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    permissions:
      security-events: write # Required for codeql-action/upload-sarif to upload SARIF files.
      actions: read          # Needed for codeql-action/upload-sarif to read workflow run info.
      contents: read         # Needed to clone the repo.
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-workflow-lint.yml@d9a465cfe7c3e582d8712658ff653cc9e259f1ba # 2.9.6
