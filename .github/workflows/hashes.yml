name: Verify package hashes

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string

permissions: {}

jobs:
  zip-md5:
    name: Zip md5
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Download zip and md5 hash from wordpress.org
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          wget --output-document=package.zip "https://wordpress.org/wordpress-${TAG}.zip" \
            --user-agent="WordPress/${TAG}"
          wget --output-document=package.zip.md5 "https://wordpress.org/wordpress-${TAG}.zip.md5" \
            --user-agent="WordPress/${TAG}"

      - name: Check the md5 hash
        run: | #shell
          echo "$(cat package.zip.md5) package.zip" | md5sum --check -

  zip-sha1:
    name: Zip sha1
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Download zip and sha1 hash from wordpress.org
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          wget --output-document=package.zip "https://wordpress.org/wordpress-${TAG}.zip" \
            --user-agent="WordPress/${TAG}"
          wget --output-document=package.zip.sha1 "https://wordpress.org/wordpress-${TAG}.zip.sha1" \
            --user-agent="WordPress/${TAG}"

      - name: Check the sha1 hash
        run: | #shell
          echo "$(cat package.zip.sha1) package.zip" | sha1sum --check -

  tar-md5:
    name: Tar md5
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Download tar.gz and md5 hash from wordpress.org
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          wget --output-document=package.tar.gz "https://wordpress.org/wordpress-${TAG}.tar.gz" \
            --user-agent="WordPress/${TAG}"
          wget --output-document=package.tar.gz.md5 "https://wordpress.org/wordpress-${TAG}.tar.gz.md5" \
            --user-agent="WordPress/${TAG}"

      - name: Check the md5 hash
        run: | #shell
          echo "$(cat package.tar.gz.md5) package.tar.gz" | md5sum --check -

  tar-sha1:
    name: Tar sha1
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Download tar.gz and sha1 hash from wordpress.org
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          wget --output-document=package.tar.gz "https://wordpress.org/wordpress-${TAG}.tar.gz" \
            --user-agent="WordPress/${TAG}"
          wget --output-document=package.tar.gz.sha1 "https://wordpress.org/wordpress-${TAG}.tar.gz.sha1" \
            --user-agent="WordPress/${TAG}"

      - name: Check the sha1 hash
        run: | #shell
          echo "$(cat package.tar.gz.sha1) package.tar.gz" | sha1sum --check -
