name: Reproduce from source

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string
      source:
        description: Source for WordPress release
        required: true
        type: string

permissions: {}

jobs:
  reproduce:
    name: "${{ inputs.source }}"
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Prepare tag name
        id: tag
        uses: johnbillion/rave-wordpress/.github/actions/prepare-tag-name@trunk
        with:
          tag: ${{ inputs.tag }}

      - name: Git checkout github.com/wordpress/wordpress-develop
        if: inputs.source == 'github-wordpress-develop'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          git clone --depth 1 --branch "${TAG}" https://github.com/wordpress/wordpress-develop/ .

      - name: Git checkout develop.git.wordpress.org
        if: inputs.source == 'develop.git.wordpress.org'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          git clone --depth 1 --branch "${TAG}" git://develop.git.wordpress.org/ .

      - name: SVN checkout develop.svn.wordpress.org
        if: inputs.source == 'develop.svn.wordpress.org'
        uses: johnbillion/plugin-infrastructure/actions/svn-with-retry@d9a465cfe7c3e582d8712658ff653cc9e259f1ba # 2.9.6
        with:
          url: https://develop.svn.wordpress.org/tags/${{ steps.tag.outputs.short }}/

      - name: Download zip from core.trac.wordpress.org
        if: inputs.source == 'core.trac.wordpress.org'
        uses: johnbillion/plugin-infrastructure/actions/download-with-retry@d9a465cfe7c3e582d8712658ff653cc9e259f1ba # 2.9.6
        with:
          url: https://core.trac.wordpress.org/browser/tags/${{ steps.tag.outputs.short }}?format=zip
          output: package.zip

      - name: Extract zip from core.trac.wordpress.org
        if: inputs.source == 'core.trac.wordpress.org'
        env:
          TAG: ${{ steps.tag.outputs.short }}
        run: | #shell
          unzip -q package.zip
          shopt -s dotglob
          mv "${TAG}"/* .
          shopt -u dotglob
          rm -rf "${TAG}"
          rm package.zip

      - name: Log file list
        run: | #shell
          ls -la

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Log debug information
        run: | #shell
          npm --version
          node --version
          git --version

      - name: Install npm dependencies
        run: | #shell
          npm ci --no-audit --no-fund --loglevel=error

      - name: Run emoji precommit task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | #shell
          npm run grunt precommit:emoji

      - name: Build WordPress
        run: | #shell
          npm run build

      - name: Verify update check URL is as expected
        run: | #shell
          grep --fixed-strings "://api.wordpress.org/core/version-check/1.7/" build/wp-includes/update.php

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-${{ steps.tag.outputs.long }}-${{ inputs.source }}
          path: build
          if-no-files-found: error
