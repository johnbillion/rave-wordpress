name: Fetch build

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name for WordPress release
        required: true
        type: string
      build:
        description: Build name for WordPress release
        required: true
        type: string

permissions: {}

jobs:
  reproduce:
    name: "${{ inputs.build }}"
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Prepare tag name
        id: tag
        uses: $/.github/actions/prepare-tag-name
        with:
          tag: ${{ inputs.tag }}

      - name: Git checkout core.git.wordpress.org
        if: inputs.build == 'core.git.wordpress.org'
        env:
          TAG: ${{ steps.tag.outputs.long }}
        run: | #shell
          git clone --depth 1 --branch "${TAG}" git://core.git.wordpress.org/ .

      - name: SVN checkout core.svn.wordpress.org
        if: inputs.build == 'core.svn.wordpress.org'
        uses: johnbillion/plugin-infrastructure/actions/svn-with-retry@5da00cd003a94ef534a553d48b78a20ef4fadf0d # 2.9.7
        with:
          url: https://core.svn.wordpress.org/tags/${{ steps.tag.outputs.short }}/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-${{ steps.tag.outputs.long }}-${{ inputs.build }}
          path: .
          if-no-files-found: error
