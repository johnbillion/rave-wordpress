name: Download with retry
description: Downloads a file with retry logic

inputs:
  url:
    description: URL to download from
    required: true
  output:
    description: Output filename
    required: true

runs:
  using: composite
  steps:
    - name: Download with retry
      shell: bash
      env:
        DOWNLOAD_URL: ${{ inputs.url }}
        OUTPUT_FILE: ${{ inputs.output }}
      run: | #shell
        echo "Downloading ${DOWNLOAD_URL} to ${OUTPUT_FILE}"
        curl --output "${OUTPUT_FILE}" \
          --user-agent "WordPress/6.8" \
          --location \
          --retry 2 \
          --retry-delay 30 \
          --retry-all-errors \
          --connect-timeout 30 \
          --max-time 120 \
          --fail \
          --show-error \
          "${DOWNLOAD_URL}"
